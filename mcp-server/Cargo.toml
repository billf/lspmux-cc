[package]
name = "lspmux-cc-mcp"
version = "0.2.0"
edition = "2021"
description = "MCP server for lspmux rust-analyzer integration"
license = "MIT"

[dependencies]
# rmcp 1.4's semver range admits newer macros releases, but they generate calls
# introduced after the 1.4 runtime. Keep the runtime and proc macro aligned.
rmcp = { version = "=3.2.0", features = ["server", "transport-io", "macros"] }
rmcp-macros = "=1.4.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
lsp-types = "0.97"
anyhow = "1"
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "8.0.2"
directories = "6"
metrics = "0.24"
libc = "0.2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
