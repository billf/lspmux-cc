name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo +stable fmt --manifest-path mcp-server/Cargo.toml --all -- --check

      - name: Lint
        run: cargo +stable clippy --locked --manifest-path mcp-server/Cargo.toml --all-targets -- -D warnings

      - name: Build
        run: cargo +stable build --locked --manifest-path mcp-server/Cargo.toml --all-targets

      - name: Test
        run: cargo +stable test --locked --manifest-path mcp-server/Cargo.toml

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Lint shell scripts
        run: shellcheck setup bin/* hooks/scripts/*.sh
